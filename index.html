<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Apply the saved theme before the page paints, so dark mode never flashes white. */
      try {
        var t = localStorage.getItem("trending-archive.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- favicon -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0A5BD6" />
    <meta name="description" content="TrendArchive: stories, ideas and what is trending." />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="TrendArchive"
      href="https://trendarchive.com/rss.xml"
    />

    <!-- favicon -->
    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Trending entertainment news and stories, kept in one place."
    />
    <title>Trending Archive — Trending Entertainment & Stories</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
